name: Feature request
description: Suggest an improvement to the macOS VM app.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How to verify it works
      description: "Describe useful host and Windows checks. Keep personal information and VM contents out of the request."
